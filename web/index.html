<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Report</title>
<meta name="description" content="Report food-safety problems in two taps.">
<meta name="theme-color" content="#070B0E">
<!-- The theme before any CSS loads (src/styles/tokens/theme.css): the person's choice (prefs.theme), else dark. -->
<script>(function(){var t='dark';try{t=(JSON.parse(localStorage.getItem('let-report:prefs'))||{}).theme==='light'?'light':'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#F2F8FE':'#070B0E');})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Let Report">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@500;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=%V%">
</head>
<body>
<div id="root"></div>
<noscript>Let Report needs JavaScript turned on.</noscript>
<script src="app.js?v=%V%" defer></script>
</body>
</html>
